name: Monado weekly

# Mirador's Monado: upstream main, built once a week (it was nightly) with
# Mirador's recipe (tools\build-monado.ps1) and checked (tools\check-monado-build.ps1, then a headless start on a machine
# of its own: tools\check-monado-session.ps1), then signed and published as a prerelease monado-<yyyy.mm.dd>-<short sha>
# when its checks pass. Skipped when upstream has no new commit since the last published build; a failed week publishes
# nothing and fails the run (started again by hand, with workflow_dispatch). The last 2 are kept: Mirador offers only the
# newest, and "Roll back" goes to the version the helper kept on disk, so older releases are never asked for.
#
# Signing waits for an approval: once the checks have passed, the run stops in the "release" environment until its
# reviewer approves it (GitHub fails it after 30 days), and only then signs and publishes. Nothing is published unsigned.
#
# A push that changes the recipe, the checks or this file builds and checks too, without signing or publishing.

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays, 03:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Build and publish even when upstream has no new commit
        type: boolean
        default: false
      publish:
        description: Publish the build when its checks pass (off to try the checks only)
        type: boolean
        default: true
  push:
    paths:
      - tools/build-monado.ps1
      - tools/check-monado-build.ps1
      - tools/check-monado-session.ps1
      - tools/xr-check/**
      - tools/vcpkg-commit.txt
      - .github/workflows/monado-weekly.yml

permissions:
  contents: read

# A push's run gives way to a newer push; a scheduled or started run is never cancelled (a push to main during the
# Monday run mustn't cost that week's build), and two of them take turns: a run that waits for its approval holds the
# next one back until it is approved or rejected.
concurrency:
  group: monado-weekly-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  UPSTREAM: https://gitlab.freedesktop.org/monado/monado.git
  KEEP: 2

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 150
    outputs:
      skip: ${{ steps.upstream.outputs.skip }}
      commit: ${{ steps.upstream.outputs.commit }}
      tag: ${{ steps.upstream.outputs.tag }}
      # The zip's hash, for the jobs that take it: an artifact can be replaced by any job of the run, this can't.
      sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Upstream's head, and whether it is built already
        id: upstream
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          $commit = ((git ls-remote $env:UPSTREAM refs/heads/main) -split '\s+')[0]
          if ($commit -notmatch '^[0-9a-f]{40}$') { throw "Upstream's main couldn't be read: $commit" }
          $short = $commit.Substring(0, 10)
          $tag = "monado-$([DateTime]::UtcNow.ToString('yyyy.MM.dd'))-$short"
          $last = gh release list --limit 100 --json tagName,isPrerelease,createdAt |
              ConvertFrom-Json | Where-Object { $_.tagName -like 'monado-*' } | Sort-Object createdAt -Descending | Select-Object -First 1
          # Only a run that publishes skips: a scheduled one, or a started one with "publish" on, when upstream has no
          # commit since the last published build ("force" builds and publishes it again). A push, or a started run
          # that only tries the checks, always builds.
          $publishing = $env:GITHUB_EVENT_NAME -ne 'push' -and $env:PUBLISH -eq 'true'
          $skip = $publishing -and $last -and $last.tagName.EndsWith("-$short") -and $env:FORCE -ne 'true'
          # The same commit published today already: its tag exists, so there is nothing new to publish.
          if ($publishing -and (gh release list --limit 100 --json tagName | ConvertFrom-Json | Where-Object { $_.tagName -eq $tag })) {
              $skip = $true
              Write-Host "::notice::$tag is published already today; nothing new to publish (force can't publish a tag twice)."
          }
          Write-Host "Upstream main: $commit; last published: $($last.tagName); skip: $skip"
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "skip=$($skip.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Upstream's source
        if: steps.upstream.outputs.skip != 'true'
        shell: pwsh
        env:
          COMMIT: ${{ steps.upstream.outputs.commit }}
        run: |
          git init -q monado
          git -C monado fetch -q --depth 1 $env:UPSTREAM $env:COMMIT
          git -C monado checkout -q FETCH_HEAD
          git -C monado remote add origin $env:UPSTREAM

      - name: Mirador's vcpkg
        if: steps.upstream.outputs.skip != 'true'
        id: vcpkg
        shell: pwsh
        run: |
          $pin = (Get-Content tools\vcpkg-commit.txt -TotalCount 1).Trim()
          # The whole history: Monado's vcpkg.json names a baseline commit in it, and vcpkg reads old versions of its
          # ports from git with a cleaned environment, in which a partial clone can't fetch what it lacks.
          git clone -q https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP\vcpkg" checkout -q $pin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A pin that isn't on vcpkg's history must fail the run, not build with vcpkg's newest.
          $head = (git -C "$env:RUNNER_TEMP\vcpkg" rev-parse HEAD).Trim()
          if ($head -ne $pin) { Write-Error "vcpkg is at $head, not the pin $pin."; exit 1 }
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cache = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\vcpkg-cache"
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$($cache.FullName)" >> $env:GITHUB_ENV
          "pin=$pin" >> $env:GITHUB_OUTPUT

      # A week without dependency changes doesn't build them again. Only the exact key: an entry under it is this
      # job's own, while a prefix would also take one that another job of an earlier run saved.
      - name: vcpkg's binary cache
        if: steps.upstream.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ steps.vcpkg.outputs.pin }}-${{ hashFiles('monado/vcpkg.json') }}

      - name: Build
        if: steps.upstream.outputs.skip != 'true'
        shell: pwsh
        run: tools\build-monado.ps1 -Source monado -Build "$env:RUNNER_TEMP\monado-build" -Install "$env:RUNNER_TEMP\monado-install"

      - name: Checks
        if: steps.upstream.outputs.skip != 'true'
        shell: pwsh
        run: tools\check-monado-build.ps1 -Install "$env:RUNNER_TEMP\monado-install" -Build "$env:RUNNER_TEMP\monado-build"

      # The OpenXR test client for the session job, built here where the tools and vcpkg are.
      - name: xr-check
        if: steps.upstream.outputs.skip != 'true'
        shell: pwsh
        run: tools\build-cmake.ps1 -Source tools\xr-check -BuildDir "$env:RUNNER_TEMP\xr-check-build" -Configure -Build

      - name: The zip
        if: steps.upstream.outputs.skip != 'true'
        id: zip
        shell: pwsh
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path "$env:RUNNER_TEMP\monado-install\*" -DestinationPath "out\$env:TAG.zip" -CompressionLevel Optimal
          "sha256=$((Get-FileHash -Algorithm SHA256 "out\$env:TAG.zip").Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Upload the build
        if: steps.upstream.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monado
          if-no-files-found: error
          path: out/

      - name: Upload xr-check
        if: steps.upstream.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xr-check
          if-no-files-found: error
          path: ${{ runner.temp }}/xr-check-build/xr-check.exe

      - name: The build log of a failed build
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monado-failure
          path: |
            ${{ runner.temp }}/monado-build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/monado-build/Testing/Temporary/
            ${{ runner.temp }}/monado-build/vcpkg-manifest-install.log

  # The last check: the zip just built starts headless and an OpenXR app connects to it (tools\check-monado-session.ps1).
  # A scheduled or started run takes the self-hosted GPU runner (a Windows Server VM with a GTX 750 Ti, started for
  # the week's run): there Monado's null compositor runs whole Vulkan and D3D11 sessions. A push
  # stays on GitHub's runners, which have no GPU (Monado's compositor needs a Vulkan device with Windows' sharing
  # extensions), so only an instance is checked and the push never waits for the VM. It tests the zip as uploaded, on
  # a machine of its own, and can't write anything.
  session:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ${{ github.event_name == 'push' && 'windows-2025' || fromJSON('["self-hosted", "gpu"]') }}
    timeout-minutes: 8 # the GPU runner VM is forced off 10 min after it starts
    env:
      TAG: ${{ needs.build.outputs.tag }}
      SHA256: ${{ needs.build.outputs.sha256 }}
      APIS: ${{ github.event_name == 'push' && 'none' || 'none,vulkan,d3d11' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: monado
          path: ${{ runner.temp }}/monado-zip

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xr-check
          path: ${{ runner.temp }}/xr-check

      - name: The build, unpacked
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\monado-zip\$env:TAG.zip"
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant() -ne $env:SHA256) { throw 'The zip isn''t the one the build job made.' }
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP\monado-install"

      # The runner runs elevated, where the OpenXR loader ignores XR_RUNTIME_JSON: the build is made the machine's runtime.
      - name: The build as the OpenXR runtime
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Khronos\OpenXR\1' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Khronos\OpenXR\1' -Name ActiveRuntime -Value "$env:RUNNER_TEMP\monado-install\openxr_monado.json"

      - name: Monado starts and takes an app
        shell: pwsh
        run: tools\check-monado-session.ps1 -Install "$env:RUNNER_TEMP\monado-install" -XrCheck "$env:RUNNER_TEMP\xr-check\xr-check.exe" -Api ($env:APIS -split ',')

      - name: The session's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monado-session
          path: ${{ runner.temp }}/monado-session/

  # The only job that can sign, and only for a run that publishes. It runs in the "release" environment, which takes
  # main and v* tags only and waits for an approval, and Azure takes a token from no other job. It compiles nothing: it
  # signs the build the session job checked (every program and DLL without a signature: Monado's own and the libraries
  # vcpkg built for it; Microsoft's C++ runtime keeps its own) and packs the zip again.
  sign:
    name: Sign
    needs: [build, session]
    if: needs.build.outputs.skip != 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: windows-2025
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    outputs:
      signer: ${{ steps.sign.outputs.signer }}
      sha256: ${{ steps.zip.outputs.sha256 }}
    env:
      TAG: ${{ needs.build.outputs.tag }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: monado
          path: ${{ runner.temp }}/monado-zip

      - name: The build, unpacked
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\monado-zip\$env:TAG.zip"
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant() -ne $env:SHA256) { throw 'The zip isn''t the one the build job made.' }
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP\monado-install"

      # The signing library runs on it.
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: The signing library
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          CERTIFICATE_PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: >-
          tools\get-signing-library.ps1 -Out (Join-Path $env:RUNNER_TEMP 'signing')
          -Endpoint $env:ENDPOINT -Account $env:ACCOUNT -CertificateProfile $env:CERTIFICATE_PROFILE

      # No secret: Azure takes GitHub's token for this job, in this environment, of this repository.
      - name: Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign the build
        id: sign
        shell: pwsh
        run: |
          # GitHub's token behind the login lasts minutes: the signing service's token is taken now, before the
          # build's files are looked through.
          az account get-access-token --resource https://codesigning.azure.net --query expiresOn --output tsv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tools\sign-monado.ps1 -Install "$env:RUNNER_TEMP\monado-install"

      - name: Azure, signed out
        if: always()
        shell: pwsh
        run: az account clear

      - name: The signed zip
        id: zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path "$env:RUNNER_TEMP\monado-install\*" -DestinationPath "out\$env:TAG.zip" -CompressionLevel Optimal
          "sha256=$((Get-FileHash -Algorithm SHA256 "out\$env:TAG.zip").Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Upload the signed build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monado-signed
          if-no-files-found: error
          path: out/

  # Only a scheduled or started run publishes, only what the sign job signed, and only this job may write.
  publish:
    needs: [build, sign]
    if: needs.build.outputs.skip != 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
      COMMIT: ${{ needs.build.outputs.commit }}
      SIGNER: ${{ needs.sign.outputs.signer }}
      SHA256: ${{ needs.sign.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: monado-signed

      - name: The prerelease
        run: |
          [ "$(sha256sum "$TAG.zip" | cut -d' ' -f1)" = "$SHA256" ] || { echo "The zip isn't the one the sign job made." >&2; exit 1; }
          gh release create "$TAG" "$TAG.zip" --prerelease --target "$GITHUB_SHA" --title "Monado ${TAG#monado-}" \
            --notes "Upstream Monado main at $COMMIT, built by Mirador's CI with tools/build-monado.ps1; its checks (checks.json in the zip) passed. Signed by $SIGNER. SHA-256: $SHA256"

      - name: Keep the last ${{ env.KEEP }}
        run: |
          gh release list --limit 100 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("monado-"))] | sort_by(.createdAt) | reverse | .[(env.KEEP | tonumber):] | .[].tagName' |
            while read -r old; do
              gh release delete "$old" --cleanup-tag --yes
            done
