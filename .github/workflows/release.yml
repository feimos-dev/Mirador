name: Installer

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  installer:
    name: Windows installer
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Inno Setup
        shell: pwsh
        run: tools\get-inno-setup.ps1

      - name: The bundle and the installer
        shell: pwsh
        run: |
          tools\build-bundle.ps1
          tools\build-installer.ps1

      - name: The tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "artifacts\Mirador-$($env:GITHUB_REF_NAME.Substring(1))-setup.exe")) {
            "::error::The tag $env:GITHUB_REF_NAME doesn't match the version built ($((Get-Item artifacts\Mirador-*-setup.exe).Name)): set <Version> in Directory.Build.props."
            exit 1
          }

      - name: Upload the installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          if-no-files-found: error
          path: artifacts/Mirador-*-setup.exe

      - name: Upload the bundle, to sign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          if-no-files-found: error
          path: artifacts/bundle

  sign:
    name: Sign
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: artifacts/bundle

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Inno Setup
        shell: pwsh
        run: tools\get-inno-setup.ps1

      - name: The signing library
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          CERTIFICATE_PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: >-
          tools\get-signing-library.ps1 -Out (Join-Path $env:RUNNER_TEMP 'signing')
          -Endpoint $env:ENDPOINT -Account $env:ACCOUNT -CertificateProfile $env:CERTIFICATE_PROFILE

      - name: Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign the programs, then build and sign the installer
        shell: pwsh
        run: |
          az account get-access-token --resource https://codesigning.azure.net --query expiresOn --output tsv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tools\sign-bundle.ps1
          tools\build-installer.ps1 -Sign
          tools\check-signatures.ps1 (Get-Item artifacts\Mirador-*-setup.exe).FullName

      - name: Azure, signed out
        if: always()
        shell: pwsh
        run: az account clear

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          if-no-files-found: error
          path: artifacts/Mirador-*-setup.exe

  signed-check:
    name: Signed installer
    needs: sign
    runs-on: windows-2025
    timeout-minutes: 10
    outputs:
      signer: ${{ steps.signature.outputs.signer }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: tools

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: artifacts

      - name: The installer's signature
        id: signature
        shell: pwsh
        run: tools\check-signatures.ps1 (Get-Item artifacts\Mirador-*-setup.exe).FullName

  release:
    name: Release files
    needs: signed-check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer

      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SIGNER: ${{ needs.signed-check.outputs.signer }}
        run: |
          version="${TAG#v}"
          installer="Mirador-$version-setup.exe"
          if [ ! -f "$installer" ]; then
            echo "The tag $TAG doesn't match the version built ($(ls Mirador-*-setup.exe)): set <Version> in Directory.Build.props." >&2
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$installer" --clobber
          else
            hash=$(sha256sum "$installer" | cut -d' ' -f1)
            gh release create "$TAG" "$installer" --draft --verify-tag --title "Mirador $version" \
              --notes "Signed by $SIGNER. SHA-256 of the installer: $hash"
          fi
